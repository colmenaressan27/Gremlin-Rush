<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14152B" />
    <meta name="description" content="Gremlin Rush: arcade WebAR que se juega con una mano frente a la cámara." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314152B'/%3E%3Cellipse cx='32' cy='36' rx='18' ry='20' fill='%23A5F02D'/%3E%3Ccircle cx='25' cy='30' r='7' fill='%23F5F2ED'/%3E%3Ccircle cx='40' cy='30' r='7' fill='%23F5F2ED'/%3E%3Ccircle cx='26' cy='31' r='3' fill='%2314152B'/%3E%3Ccircle cx='39' cy='31' r='3' fill='%2314152B'/%3E%3C/svg%3E"
    />
    <title>Gremlin Rush</title>
  </head>
  <body>
    <div id="stage">
      <video id="camera" playsinline muted aria-hidden="true"></video>
      <canvas id="scene" role="img" aria-label="Arena de juego de Gremlin Rush sobre la imagen de la cámara"></canvas>
      <canvas id="debug" aria-hidden="true"></canvas>
      <div id="popups"></div>
    </div>
    <div id="hud"></div>
    <main id="screens"></main>
    <noscript>Gremlin Rush necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
